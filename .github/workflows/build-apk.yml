name: Build Custom Telegram APK

# 允許你在 Actions 頁面手動點選按鈕觸發編譯
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 下載你的原始碼到雲端虛擬機
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 安裝編譯所需的 Java 環境
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. 自動注入你的 api_id 和 api_hash（安全替換，不留明文歷史紀錄）
    - name: Inject API Keys into BuildVars.java
      run: |
        SED_ID="public static int APP_ID = ${{ secrets.TG_APP_ID }};"
        SED_HASH="public static String APP_HASH = \"${{ secrets.TG_APP_HASH }}\";"
        
        # 定位 Telegram 原始碼中存放金鑰的檔案
        FILE_PATH="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
        
        # 使用 sed 指令動態替換預設值
        sed -i "s/public static int APP_ID = .*/$SED_ID/" $FILE_PATH
        sed -i "s/public static String APP_HASH = .*/$SED_HASH/" $FILE_PATH
        
        echo "✅ 憑證注入成功！"

    # 4. 執行 Android 打包指令
    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    # 5. 編譯完成後，將 APK 檔案上傳到 GitHub 介面供你下載
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Telegram-Debug-APK
        path: |
          **/*/build/outputs/apk/debug/*.apk
          **/*/build/outputs/apk/release/*.apk
