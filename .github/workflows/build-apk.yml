name: Build Custom Telegram APK (Final Repair)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 下載你的原始碼到雲端虛擬機
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 安裝編譯所需的 Java 環境，並開啟 Gradle 快取機制
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle' # 👈 這行會自動讀取上次儲存的快取，幫你省下大量下載時間！

    # 3. 自動注入你的 api_id 和 api_hash
    - name: Inject API Keys into BuildVars.java
      run: |
        SED_ID="public static int APP_ID = ${{ secrets.TG_APP_ID }};"
        SED_HASH="public static String APP_HASH = \"${{ secrets.TG_APP_HASH }}\";"
        FILE_PATH="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
        
        sed -i "s/public static int APP_ID = .*/$SED_ID/" $FILE_PATH
        sed -i "s/public static String APP_HASH = .*/$SED_HASH/" $FILE_PATH
        echo "✅ 憑證注入成功！"

    # 4. 執行 Android 打包指令（跳過程式碼規範檢查、跳過測試以全面加速）
    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug -x test -x lint --no-daemon

    # 5. 🔥 終極修復：從根目錄開始，全域地毯式搜尋任何副檔名為 .apk 的檔案並上傳
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Telegram-Debug-APK
        if-no-files-found: error # 如果整台虛擬機器真的完全沒編譯出 APK 才會報錯
        path: |
          ./**/*.apk
